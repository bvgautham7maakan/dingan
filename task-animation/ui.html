<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claude code</title>
<style>
  :root {
    --bg: #050805; --green: #00ff41; --cyan: #22d3ee; --pink: #ff7ad9; --amber: #ffcf5c;
    --text: #c8ffd4; --dim: #6b8f71; --pun: #6f9a78; --line: #0f2a14; --gutter: #2f5236;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.3 "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; border: 1px solid var(--line); box-sizing: border-box; }

  header { display: flex; align-items: center; gap: 10px; height: 30px; flex: none;
    padding: 0 6px 0 10px; background: #081208; border-bottom: 1px solid var(--line); cursor: default; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none;
    box-shadow: 0 0 6px var(--green); animation: pulse 1.6s steps(8) infinite; }  /* stepped: ~5 repaints/s, not 60 */
  body.idle .dot { animation: none; opacity: .35; box-shadow: none; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  .brand { color: var(--green); font-weight: bold; flex: none; }
  #status { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  #timer { color: var(--amber); font-variant-numeric: tabular-nums; flex: none; }
  header button { all: unset; width: 26px; height: 22px; line-height: 22px; text-align: center; flex: none;
    color: var(--dim); cursor: pointer; border-radius: 3px; }
  header button:hover { background: #123018; color: var(--green); }
  header #close:hover { background: #3a1020; color: var(--pink); }

  main { flex: 1; display: flex; min-height: 0; position: relative; }
  #code { width: 48%; flex: none; position: relative; overflow: hidden; border-right: 1px solid var(--line);
    transition: opacity .5s; }
  #code.dim { opacity: .42; }
  #lines { position: absolute; inset: 6px 0; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  .ln { display: flex; white-space: pre; line-height: 17px; min-height: 17px; flex: none; }
  .g { width: 34px; flex: none; text-align: right; padding-right: 10px; color: var(--gutter); }
  .c { overflow: hidden; }
  .kw { color: var(--pink); } .num { color: var(--amber); } .pun { color: var(--pun); } .sep { color: var(--gutter); }
  .cur { display: inline-block; width: .62em; height: 14px; vertical-align: -2px; background: var(--green);
    animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  body.hidden *, body.paused .cur { animation-play-state: paused !important; }

  #matrix { flex: 1; position: relative; min-width: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hex { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 6px 8px; white-space: pre; overflow: hidden;
    background: rgba(5, 8, 5, .72); border: 1px solid rgba(0, 255, 65, .22); border-radius: 3px;
    font-size: 12px; line-height: 16px; color: rgba(0, 255, 65, .42); }
  #hex div:last-child { color: var(--green); text-shadow: 0 0 4px rgba(0, 255, 65, .6); }
  #grip { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; z-index: 5;
    background: linear-gradient(135deg, transparent 55%, #1d4a26 55%); }
</style>
</head>
<body>
<div id="app">
  <header class="pywebview-drag-region">
    <span class="dot pywebview-drag-region"></span>
    <span class="brand pywebview-drag-region">claude code</span>
    <span id="status" class="pywebview-drag-region">idle</span>
    <span id="timer" class="pywebview-drag-region">00:00</span>
    <button id="min" title="Minimize to tray (Ctrl+Alt+M)">&#8211;</button>
    <button id="close" title="Hide to tray">&#215;</button>
  </header>
  <main>
    <section id="code" class="dim"><div id="lines"></div></section>
    <section id="matrix">
      <canvas id="rain"></canvas>
      <canvas id="tokens"></canvas>
      <div id="hex"></div>
    </section>
    <div id="grip" title="Resize"></div>
  </main>
</div>
<script>
'use strict';
// All hook-derived text is inserted with textContent / canvas fillText only.
window.TA = (() => {
  const $ = (id) => document.getElementById(id);
  const cfg = {
    typing_ms_per_char: 45, backlog_chars: 1500, stop_flush_max_ms: 3000,
    rain_step_ms: 90, token_step_ms: 180, hex_update_ms: 350,
    colors: { background: '#050805', green: '#00ff41', cyan: '#22d3ee', pink: '#ff7ad9', amber: '#ffcf5c' },
  };
  let visible = true, paused = false;

  function api(name, ...args) {
    try {
      const fn = window.pywebview && window.pywebview.api && window.pywebview.api[name];
      if (fn) fn(...args);
    } catch (e) { /* bridge not ready */ }
  }

  // ------------------------------------------------------------------ header
  const statusEl = $('status'), timerEl = $('timer');
  let tStart = null, tFrozen = 0;
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function tickTimer() { if (tStart !== null) timerEl.textContent = fmt(Date.now() - tStart); }
  setInterval(() => { if (visible) tickTimer(); }, 500);
  function setStatus(text) { statusEl.textContent = text; statusEl.title = text; }

  // -------------------------------------------------------------- typewriter
  const KW = new Set(('def class return if elif else for while in import from as with try except finally raise ' +
    'lambda yield async await pass break continue and or not is None True False self function const let var new ' +
    'this typeof instanceof export default switch case public private protected static void int float double ' +
    'string bool boolean char fn pub use mod impl struct enum match mut Self package func go defer interface type ' +
    'null undefined true false nil end then do local require echo fi esac elseif foreach param catch throw throws ' +
    'extends implements override virtual namespace using template typename auto unsigned long short where select'
  ).split(' '));
  const TOKEN_RE = /([A-Za-z_$][\w$]*)|(0[xX][0-9a-fA-F]+|\d[\d_]*(?:\.\d+)?)|(\s+)|([^\w\s])/g;
  const MAX_LINES = 140, MAX_RENDER = 400;
  const linesEl = $('lines'), codeEl = $('code');
  let lineNo = 0, cur = null;           // cur = { el, codeEl, text }
  let segs = [];                        // [{kind:'header'|'text', s, i, demo}]
  let typing = false, typeTimer = null, idleSince = Date.now();
  let hasReal = false, demoActive = false, demoTimer = null;
  let flush = null;                     // {deadline, gen}

  function span(cls, text) {
    const s = document.createElement('span');
    if (cls) s.className = cls;
    s.textContent = text;
    return s;
  }
  function renderLine(line, withCursor) {
    const c = line.codeEl;
    c.textContent = '';
    if (line.sep) { c.appendChild(span('sep', line.text)); }
    else {
      const t = line.text.length > MAX_RENDER ? line.text.slice(0, MAX_RENDER) : line.text;
      TOKEN_RE.lastIndex = 0;
      let m;
      while ((m = TOKEN_RE.exec(t)) !== null) {
        if (m[1]) c.appendChild(KW.has(m[1]) ? span('kw', m[1]) : document.createTextNode(m[1]));
        else if (m[2]) c.appendChild(span('num', m[2]));
        else if (m[3]) c.appendChild(document.createTextNode(m[3]));
        else c.appendChild(span('pun', m[4]));
      }
    }
    if (withCursor) c.appendChild(span('cur', ''));
  }
  function newLine(sep) {
    if (cur) renderLine(cur, false);
    const el = document.createElement('div');
    el.className = 'ln';
    const g = span('g', sep ? '' : String(++lineNo));
    const c = span('c', '');
    el.append(g, c);
    linesEl.appendChild(el);
    while (linesEl.childElementCount > MAX_LINES) linesEl.removeChild(linesEl.firstElementChild);
    cur = { el, codeEl: c, text: '', sep: !!sep };
    return cur;
  }
  function clearCode() {
    linesEl.textContent = '';
    cur = null; lineNo = 0;
  }
  function pendingChars() {
    let n = 0;
    for (const s of segs) n += s.s.length - s.i;
    return n;
  }
  function pendingReal() { return segs.some((s) => !s.demo); }

  function enqueue(file, code, demo) {
    code = String(code).replace(/\r\n?/g, '\n').replace(/\t/g, '    ');
    if (!demo) {
      if (!hasReal || demoActive) { segs = []; clearCode(); }
      hasReal = true; demoActive = false;
      clearTimeout(demoTimer);
    }
    if (file) segs.push({ kind: 'header', s: '// ── ' + file + ' ──', i: 0, demo });
    segs.push({ kind: 'text', s: code.endsWith('\n') ? code : code + '\n', i: 0, demo });
    skipAhead();
    startTyping();
  }
  // Never lag far behind real activity: drop whole old payloads first, then jump
  // into the newest one at a line boundary.
  function skipAhead() {
    const limit = cfg.backlog_chars * 2;
    while (segs.length > 2 && pendingChars() > limit) segs.shift();
    if (pendingChars() <= limit) return;
    const last = segs[segs.length - 1];
    let cut = last.s.length - cfg.backlog_chars;
    const nl = last.s.indexOf('\n', cut);
    if (nl !== -1 && nl < last.s.length - 1) cut = nl + 1;
    last.i = Math.max(last.i, cut);
    segs = [{ kind: 'header', s: '// \u2026 skipped ahead \u2026', i: 0, demo: last.demo }, last];
  }
  function charsPerTick() {
    const p = pendingChars();
    if (flush) {
      const ticksLeft = Math.max(1, (flush.deadline - Date.now()) / cfg.typing_ms_per_char);
      return Math.max(1, Math.ceil(p / ticksLeft));
    }
    return p > cfg.backlog_chars ? Math.ceil(p / 150) : 1;
  }
  function typeChars(n) {
    while (n > 0 && segs.length) {
      const seg = segs[0];
      if (seg.kind === 'header') {
        if (cur && !cur.text && !cur.sep) { cur.el.remove(); cur = null; }   // drop trailing blank line
        newLine(true).text = seg.s;
        renderLine(cur, false);
        lineNo = 0;
        newLine(false);
        segs.shift();
        continue;
      }
      if (!cur) newLine(false);
      const ch = seg.s[seg.i++];
      if (ch === '\n') newLine(false); else cur.text += ch;
      n--;
      if (seg.i >= seg.s.length) segs.shift();
    }
    if (cur) renderLine(cur, true);
  }
  function startTyping() {
    if (typeTimer || !visible) return;
    typeTimer = setTimeout(typeTick, cfg.typing_ms_per_char);
  }
  function typeTick() {
    typeTimer = null;
    if (!visible) return;
    if (segs.length) {
      codeEl.classList.remove('dim');
      typeChars(charsPerTick());
      idleSince = Date.now();
    }
    checkFlush();
    if (segs.length) { startTyping(); return; }
    // queue empty
    if (hasReal) codeEl.classList.add('dim');
    else if (demoActive) { clearTimeout(demoTimer); demoTimer = setTimeout(runDemo, 2500); }
  }
  function checkFlush() {
    if (!flush) return;
    if (!pendingReal() || Date.now() >= flush.deadline) {
      const gen = flush.gen;
      flush = null;
      if (pendingReal()) { while (segs.length) typeChars(100000); }   // dump the rest instantly
      api('flushed', gen);
    }
  }

  const DEMO = [
    'def wake_up(neo):',
    '    """follow the white rabbit"""',
    '    for frame in range(0x1F):',
    '        signal = decode(frame, key=42)',
    '        if signal.is_anomaly():',
    '            return trace(signal) => "knock knock"',
    '    return None',
    '',
    'const matrix = new Grid({ rows: 24, cols: 80 });',
    'matrix.on("glitch", (cat) => deja_vu(cat, 2));',
  ].join('\n');
  function runDemo() {
    if (hasReal || !visible || paused) return;
    demoActive = true;
    segs = [];
    clearCode();
    codeEl.classList.remove('dim');
    enqueue('demo.py', DEMO, true);
  }

  // ------------------------------------------------------------------ matrix
  const KATA = 'ｦｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789';
  const TOKENS = ['def', '=>', '{}', 'if', '0x', 'let', '()', '::', 'fn', '[]'];
  const matrixEl = $('matrix'), rainC = $('rain'), tokC = $('tokens'), hexEl = $('hex');
  const rctx = rainC.getContext('2d'), tctx = tokC.getContext('2d');
  const FS = 14, TFS = 13;
  let W = 0, H = 0, drops = [], tcols = [], hexAddr = 0, hexLines = [];
  let loopTimer = null, lastRain = 0, lastTok = 0, lastHex = 0;
  const rnd = (n) => Math.floor(Math.random() * n);

  function resize() {
    const r = matrixEl.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    for (const [c, x] of [[rainC, rctx], [tokC, tctx]]) {
      c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    rctx.fillStyle = cfg.colors.background; rctx.fillRect(0, 0, W, H);
    const n = Math.max(1, Math.floor(W / FS));
    drops = Array.from({ length: n }, () => ({ y: -rnd(Math.ceil(H / FS) + 10), prev: null }));
    const tn = 7;
    tcols = Array.from({ length: tn }, (_, i) => ({
      x: Math.round((i + 0.5) * (W / tn) + (Math.random() - 0.5) * 18),
      y: -rnd(12), wait: rnd(6),
    }));
  }
  function stepRain() {
    rctx.fillStyle = hexToRgba(cfg.colors.background, 0.09);
    rctx.fillRect(0, 0, W, H);
    rctx.font = FS + 'px "MS Gothic", "Cascadia Mono", monospace';
    rctx.textBaseline = 'top';
    const rows = Math.ceil(H / FS);
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i], x = i * FS;
      if (d.prev && d.y - 1 >= 0) {            // demote previous head to trail colour
        rctx.fillStyle = cfg.colors.background; rctx.fillRect(x, (d.y - 1) * FS, FS, FS);
        rctx.fillStyle = cfg.colors.green; rctx.fillText(d.prev, x, (d.y - 1) * FS);
      }
      if (d.y >= 0) {
        const ch = KATA[rnd(KATA.length)];
        rctx.fillStyle = '#d8ffe2'; rctx.fillText(ch, x, d.y * FS);
        d.prev = ch;
      }
      d.y++;
      if (d.y > rows && Math.random() > 0.975) { d.y = -rnd(8); d.prev = null; }
    }
  }
  function stepTokens() {
    tctx.globalCompositeOperation = 'destination-out';
    tctx.fillStyle = 'rgba(0,0,0,0.16)';
    tctx.fillRect(0, 0, W, H);
    tctx.globalCompositeOperation = 'source-over';
    tctx.font = 'bold ' + TFS + 'px "Cascadia Mono", Consolas, monospace';
    tctx.textBaseline = 'top';
    tctx.fillStyle = cfg.colors.cyan;
    const rows = Math.ceil(H / (TFS + 6));
    for (const c of tcols) {
      if (c.wait > 0) { c.wait--; continue; }
      if (c.y >= 0) tctx.fillText(TOKENS[rnd(TOKENS.length)], c.x, c.y * (TFS + 6));
      c.y++;
      if (c.y > rows) { c.y = -rnd(10); c.wait = rnd(8); }
    }
  }
  function stepHex() {
    hexAddr = (hexAddr + 16) & 0xfffff;
    const bytes = Array.from({ length: 12 }, () => rnd(256).toString(16).padStart(2, '0')).join(' ');
    hexLines.push('0x' + hexAddr.toString(16).padStart(5, '0') + '  ' + bytes);
    if (hexLines.length > 5) hexLines.shift();
    hexEl.textContent = '';
    for (const l of hexLines) { const d = document.createElement('div'); d.textContent = l; hexEl.appendChild(d); }
  }
  // One timer woken only when a layer is due (no 60 fps rAF loop) keeps CPU low.
  function loop() {
    loopTimer = null;
    if (!visible || paused) return;
    let now = performance.now();
    if (now - lastRain >= cfg.rain_step_ms) { lastRain = now; stepRain(); }
    if (now - lastTok >= cfg.token_step_ms) { lastTok = now; stepTokens(); }
    if (now - lastHex >= cfg.hex_update_ms) { lastHex = now; stepHex(); }
    now = performance.now();
    const due = Math.min(lastRain + cfg.rain_step_ms, lastTok + cfg.token_step_ms, lastHex + cfg.hex_update_ms);
    loopTimer = setTimeout(loop, Math.max(10, due - now));
  }
  function startLoop() { if (!loopTimer && visible && !paused) loopTimer = setTimeout(loop, 0); }
  function hexToRgba(hex, a) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    const n = m ? parseInt(m[1], 16) : 0x050805;
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  // ---------------------------------------------------------- window chrome
  $('min').addEventListener('click', () => api('hide_user'));
  $('close').addEventListener('click', () => api('hide_user'));
  (() => {
    const grip = $('grip');
    let sx = 0, sy = 0, last = 0, on = false;
    grip.addEventListener('pointerdown', (e) => {
      on = true; sx = e.screenX; sy = e.screenY; grip.setPointerCapture(e.pointerId); api('resize_start');
      e.preventDefault();
    });
    grip.addEventListener('pointermove', (e) => {
      if (!on || Date.now() - last < 30) return;
      last = Date.now();
      api('resize_delta', e.screenX - sx, e.screenY - sy);
    });
    grip.addEventListener('pointerup', (e) => { on = false; api('resize_delta', e.screenX - sx, e.screenY - sy); });
  })();
  new ResizeObserver(resize).observe(matrixEl);

  // ------------------------------------------------------------- public API
  function applyColors() {
    const s = document.documentElement.style, c = cfg.colors;
    s.setProperty('--bg', c.background); s.setProperty('--green', c.green); s.setProperty('--cyan', c.cyan);
    s.setProperty('--pink', c.pink); s.setProperty('--amber', c.amber);
    document.body.style.background = c.background;
  }
  const CODE_TOOLS = new Set(['Write', 'Edit', 'MultiEdit', 'NotebookEdit']);

  const TA = {
    init(c) {
      if (c) { Object.assign(cfg, c, { colors: Object.assign({}, cfg.colors, c.colors || {}) }); }
      applyColors(); resize(); startLoop();
      if (!hasReal) runDemo();
    },
    onPrompt() {
      document.body.classList.remove('idle');
      flush = null;
      tStart = Date.now(); tickTimer();
      setStatus('thinking…');
    },
    onTool(d) {
      d = d || {};
      document.body.classList.remove('idle');
      setStatus(String(d.tool || '') + (d.target ? ' · ' + d.target : ''));
      if (typeof d.code === 'string' && d.code.length) enqueue(String(d.file || ''), d.code, false);
      else if (!CODE_TOOLS.has(d.tool) && hasReal && !pendingReal()) codeEl.classList.add('dim');
    },
    onStop(d) {
      d = d || {};
      document.body.classList.add('idle');
      if (tStart !== null) { tickTimer(); tStart = null; }
      setStatus('done');
      flush = { deadline: Date.now() + (d.maxMs || cfg.stop_flush_max_ms), gen: d.gen };
      if (!visible || !pendingReal()) checkFlush(); else startTyping();
    },
    setVisible(v) {
      visible = !!v;
      document.body.classList.toggle('hidden', !visible);
      if (visible) { resize(); startLoop(); startTyping(); if (!hasReal && !segs.length) runDemo(); }
      else if (flush) checkFlush();
    },
    setPaused(p) {
      paused = !!p;
      document.body.classList.toggle('paused', paused);
      if (!paused) startLoop();
    },
    // test hooks
    _state: () => ({ looping: !!loopTimer, typing: !!typeTimer, pending: pendingChars(), hasReal, demoActive, visible, paused, flush: !!flush,
      text: Array.from(linesEl.querySelectorAll('.c')).map((e) => e.textContent).join('\n') }),
  };
  return TA;
})();
// Standalone (opened in a browser without pywebview): start with defaults.
setTimeout(() => { if (!window.pywebview) TA.init(); }, 300);
</script>
</body>
</html>
